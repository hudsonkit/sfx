name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (no actual publish)'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and test
        run: |
          bun run typecheck
          bun run test

      - name: Build
        run: bun run build

      - name: Get version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: tag_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set version
        run: npm version ${{ steps.tag_version.outputs.VERSION || inputs.version }} --no-git-tag-version --allow-same-version

      - name: Publish @hudsonkit/sfx
        # A release re-run must be able to finish what an earlier run started:
        # publishing a version npm already has is an error, so skip it.
        run: |
          bun run check:dist
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN: would publish $name@$version"
            npm pack --dry-run --ignore-scripts
          elif npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; skipping"
          else
            npm publish --provenance --access public --ignore-scripts
          fi
